<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remix Tree</title>
    <link rel="preconnect" href="https://trampoline.turbowarp.org" crossorigin>
    <link rel="preconnect" href="https://renderapi.quuq.dev" crossorigin>
    <link rel="dns-prefetch" href="https://cdn2.scratch.mit.edu">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="assets/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Zalando+Sans:ital,wght@0,200..900;1,200..900&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'">
    <script defer src="assets/config.js"></script>
    <script defer src="assets/treeLoader.js"></script>
    <script defer src="assets/canvasTree.js"></script>
    <script defer src="assets/main.js"></script>
</head>

<body>
    <div id="loading-container">
        <img src="assets/images/ajax_loader_blue_48.gif" id="loader">
        <div id="loading-info">Loading...</div>
    </div>
    <div id="info">
        <span id="title">
            <span>Showing remix tree for </span>
            <a target="_blank" id="title-link">...</a>
            <span id="root-info"></span>

            <img src="assets/images/refresh.png"
                style="margin-left: 5px;width: 24px;height: 24px;vertical-align: middle;cursor: pointer;"
                title="Regenerate remix tree (bypass cache)" onclick="refresh()">
        </span>
        <span id="tree-stats"></span>
        <form style="display: inline-flex;align-items: center;gap: 6px;margin-left: auto;margin-right: 10px;" onsubmit="handleSubmit(event)" action="">
            <div id="search-box" hidden>
                <input type="text" id="tree-search" placeholder="Search title, creator, or ID..." autocomplete="off">
                <div id="search-results" hidden></div>
            </div>
            <select onchange="switchViewer(this.value)">
                <option disabled>Choose a Viewer</option>
                <option value="canvas">Interactive (Fast)</option>
                <option value="scratch">Scratch (classic)</option>
                <option value="treant">Treant.js (custom)</option>
            </select>
            <input type="text" placeholder='Enter a project id' pattern="^[0-9]*$" onkeypress="validate(event)"
                id="idPicker">
            <input type="submit" value="Go" style="padding: 2px 8px;">
        </form>
        <div id="buttons" hidden>
            <button id="prev">⬅️ See more (<span id="prevCount"></span>)</button>
            <button id="next">See more (<span id="nextCount"></span>) ➡️</button>
        </div>
    </div>

    <div id="project-preview" hidden>
        <img id="preview-img" style="width: 200px;height: 150px;">
        <div id="preview-details">
            <a id="preview-title" target="_blank"></a>
            <div id="preview-author"></div>
            <div id="preview-created"></div>
            <div id="preview-stats">
                <span id="preview-loves"></span>
                <span id="preview-faves"></span>
                <span id="preview-views"></span>
                <span id="preview-remixes"></span>
            </div>
        </div>
    </div>

    <div id="canvas-wrapper" hidden>
        <div id="canvas-container"></div>
        <div id="canvas-hud">
            <button class="hud-btn" id="hud-zoom-in" title="Zoom In">+</button>
            <button class="hud-btn" id="hud-zoom-reset" title="Reset Zoom (1:1)">1:1</button>
            <button class="hud-btn" id="hud-zoom-out" title="Zoom Out">−</button>
            <button class="hud-btn" id="hud-fit" title="Fit Entire Tree">Fit</button>
            <button class="hud-btn" id="hud-focus" title="Jump to Entered Project">Focused</button>
            <button class="hud-btn" id="hud-root" title="Jump to Root Project">Root</button>
        </div>
    </div>

    <div class="chart" id="treant-remixtree" hidden></div>
    <div id="container" style="display: none;">
        <div id="tree-container">
            <div id="tree"></div>
            <div id="zoomContainer" hidden>
                <div id="zoomIn" class="zoom" onclick="App.wrapper.zoomIn()">
                    <img src="assets/images/zoomin.png">
                </div>
                <div id="zoomEqual" class="zoom" onclick="App.wrapper.zoomEqual()">
                    <img src="assets/images/zoomeq.png">
                </div>
                <div id="zoomOut" class="zoom" onclick="App.wrapper.zoomOut()">
                    <img src="assets/images/zoomout.png">
                </div>
            </div>
        </div>
    </div>

</body>

</html>
