[package]
name = "tree-fetcher"
version = "0.1.0"
edition = "2021"

[dependencies]
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "gzip", "brotli", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "time", "sync"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
