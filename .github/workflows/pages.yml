name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/tree-wasm

      # Rebuild the Rust layout/search/culling module from source.
      # If the build fails, the committed assets/tree_layout.wasm is used instead.
      - name: Build Rust WASM
        run: |
          if (cd rust/tree-wasm && cargo build --release --target wasm32-unknown-unknown); then
            cp rust/tree-wasm/target/wasm32-unknown-unknown/release/tree_wasm.wasm assets/tree_layout.wasm
            echo "Built tree_layout.wasm from source: $(wc -c < assets/tree_layout.wasm) bytes"
          else
            echo "::warning::Rust build failed, using committed assets/tree_layout.wasm"
          fi

      - name: Stage site
        run: |
          mkdir _site
          cp index.html tree.html _site/
          cp -r assets _site/assets
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
